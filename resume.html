<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhabya | Resume</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f7fafc);
      color: #111827;
    }
    .wrap {
      background: #fff;
      border: 1px solid #dfe7f1;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(17, 24, 39, 0.08);
      padding: 32px;
      text-align: center;
      max-width: 600px;
      width: calc(100% - 32px);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.05em;
    }
    p {
      margin: 0 0 22px;
      color: #58657c;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      font-weight: 700;
      margin: 8px;
    }
    .btn.secondary {
      background: #fff;
      color: #111827;
      border: 1px solid #dfe7f1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Bhabya Resume</h1>
    <p>The official PDF resume is below. You can also return to the portfolio page.</p>
    <a class="btn" href="BHABYA.pdf" target="_blank" rel="noopener">Open resume PDF</a>
    <a class="btn secondary" href="portfolio.html">Back to portfolio</a>
  </div>
</body>
</html>
